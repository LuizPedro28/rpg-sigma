<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de RPG</title>
<style>
:root{--bg:#f4f1ea;--fg:#221f1a;--card:#fff;--line:#d8d2c4;--ac:#7a3e9d;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#17151b;--fg:#ece8f2;--card:#221f2a;--line:#3a3545;--ac:#b98ae0}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header,.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;max-width:1200px;margin:0 auto;box-sizing:border-box}
h1{font-size:18px;margin:0;flex:1}
.role{padding:3px 10px;border-radius:99px;background:var(--ac);color:#fff;font-size:13px}
button,.btn,select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border:0}
input[type=text]{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:16px}
#lobby{max-width:420px;margin:30px auto;padding:0 16px;display:flex;flex-direction:column;gap:10px}
#app{display:none}
#wrap{max-width:1200px;margin:0 auto;overflow:auto;max-height:78vh;border-radius:8px}
#board{position:relative;container-type:inline-size;width:100%;aspect-ratio:16/10;background:#2b2833 center/contain no-repeat;overflow:hidden}
#board.grid::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#fff4 1px,transparent 1px),linear-gradient(90deg,#fff4 1px,transparent 1px);background-size:var(--gs,5cqw) var(--gs,5cqw)}
.tok{position:absolute;transform:translate(-50%,-50%);width:calc(var(--s)*1%);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.55cqw);border:2px solid #fff;box-shadow:0 2px 6px #0008;user-select:none;touch-action:none}
.tok.can{cursor:grab}
.tok.img{background:none;border:0;box-shadow:none;border-radius:0;aspect-ratio:auto;filter:drop-shadow(0 3px 4px #000a)}
.tok img{width:100%;height:auto;display:block;pointer-events:none;-webkit-user-drag:none}
.tok .n{position:absolute;top:100%;margin-top:2px;font-size:11px;white-space:nowrap;background:#000b;color:#fff;padding:0 5px;border-radius:4px}
#ed{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px;display:none;z-index:5}
#ed.on{display:block;max-height:60vh;overflow:auto}
#ed .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:1200px;margin:0 auto 8px}
.mini{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background-size:contain;background-repeat:no-repeat;background-position:center;flex:none}
#libl{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.chip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 6px}
.chip button{padding:4px 8px;border:0;background:none}
#chat{max-width:1200px;margin:8px auto;padding:0 12px;box-sizing:border-box}
#log{height:160px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px;font-size:14px;margin-bottom:8px}
#log .roll{color:var(--ac)}
.crow{display:flex;gap:8px}.crow input{flex:1;min-width:0}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:9}
input[type=number]{width:64px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:16px}
.tok.turn{filter:drop-shadow(0 0 8px #ffd54a) drop-shadow(0 0 3px #ffd54a)}
.tok.turn:not(.img){box-shadow:0 0 0 3px #ffd54a,0 0 14px #ffd54a}
.tok.ghost{opacity:.45}
.tabs{gap:6px}.tabs button{flex:1}
@media(max-width:700px){#wrap{max-height:56vh}#log{height:120px}button,.btn,select{padding:10px 12px}.tabs{overflow-x:auto;flex-wrap:nowrap}header h1{font-size:16px}}
</style></head><body>
<header><h1>🎲 Mesa de RPG</h1><span class="role" id="role"></span><button id="inv" style="display:none">🔗 Convidar</button></header>
<div id="lobby">
  <input type="text" id="name" placeholder="Seu nome" maxlength="20">
  <input type="text" id="code" placeholder="Código da mesa (ex.: K7P2X)" maxlength="8">
  <button class="p" id="join">Entrar na mesa</button>
  <button id="create">Criar nova mesa (serei o Mestre)</button>
  <div id="msg" style="font-size:13px;opacity:.8"></div>
</div>
<div id="app">
<div id="wait" style="display:none;padding:20px;text-align:center">⏳ Aguardando o mestre aprovar sua entrada…</div>
<div id="gmw"><div class="bar" id="gm">
  <label class="btn">🗺️ Trocar mapa<input id="file" type="file" accept="image/*" hidden></label>
  <button id="nomap">Remover mapa</button>
  <label class="btn"><input id="grid" type="checkbox"> Grade</label>
  <label class="btn">Tamanho <input id="scale" type="range" min="100" max="400" step="10" value="100"></label>
  <select id="ratio"><option value="auto">Proporção: da imagem</option><option value="16/10">16:10</option><option value="4/3">4:3</option><option value="1/1">Quadrado</option><option value="9/16">Vertical</option><option value="21/9">Panorâmico</option></select>
  <label class="btn">Quadrado = <input type="number" id="cell" min="0.1" step="0.1" value="1.5"> m</label><label class="btn">Colunas da grade <input type="number" id="cols" min="5" max="100" value="20"></label><label class="btn"><input type="checkbox" id="closed"> Sala fechada (aprovar novos)</label><button id="addnpc" class="p">+ NPC</button><button id="liblb">📚 Biblioteca</button>
</div>
<div class="bar" id="libp" style="display:none"><div id="libl"></div><button id="newlib" class="p">+ Novo token na biblioteca</button></div></div>
<div class="bar" id="tb"><button id="mine" class="p">Meu token</button><button id="ruler">📏 Medir</button><button id="bcb">⚔️ Combate</button><button id="bpj" style="display:none">👥 Jogadores</button><label class="btn">🔍 <input id="zoom" type="range" min="100" max="400" step="10" value="100"></label><span id="rd" style="font-size:14px"></span></div>
<div id="wrap"><div id="board"><svg id="rsv" style="display:none;position:absolute;inset:0;width:100%;height:100%;pointer-events:none"><line id="rl" stroke="#ffd54a" stroke-width="3" stroke-dasharray="6 4"/></svg></div></div>
<div id="pj" class="bar" style="display:none"><div id="pjl" style="width:100%"></div></div>
<div id="cb" class="bar" style="display:none;flex-direction:column;align-items:stretch"><b id="cbs"></b><div id="cbl"></div><div id="cbp" class="bar" style="display:none;padding:0">Bônus <input type="number" id="imod" value="0" min="-20" max="20"><button id="iroll" class="p">🎲 Rolar iniciativa</button></div><div id="cbg" class="bar" style="display:none;padding:0"><button id="c-start" class="p">⚔️ Iniciar combate</button><button id="c-npc">🎲 Rolar NPCs</button><button id="c-go" class="p">▶ Começar</button><button id="c-next" class="p">⏭ Próximo turno</button><button id="c-end">Encerrar</button></div></div>
<div id="chat"><div id="log"></div><div class="crow"><input type="text" id="cin" placeholder="Mensagem ou /r 1d20+3" maxlength="200"><button id="csend" class="p">Enviar</button><button id="cclr" style="display:none">Limpar</button></div></div>
<div id="ed">
  <div class="row"><span class="mini" id="f-prev"></span><label class="btn">📷 Foto (PNG sem fundo)<input id="f-file" type="file" accept="image/*" hidden></label><button id="f-noimg">Sem foto</button><input type="text" id="f-name" placeholder="Nome" maxlength="20"><input type="text" id="f-emoji" placeholder="🙂" maxlength="4" style="width:64px"><input type="color" id="f-color"><label>Tamanho <input type="range" id="f-size" min="3" max="30" value="8"></label><label id="f-hl" style="display:none"><input type="checkbox" id="f-hid"> Oculto dos jogadores</label></div>
  <div class="row"><button class="p" id="e-save">Salvar</button><button id="e-lib">Salvar na biblioteca</button><button id="e-del">Excluir</button><button id="e-x">Fechar</button></div>
</div>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== COLE AQUI os dados do seu projeto Supabase =====
const SB_URL='https://ywakihnmuznvtpczbchq.supabase.co', SB_KEY='sb_publishable_TXinXVh_9LQklmqPVE_ljw_ujl61Qdz';
// ======================================================
const $=id=>document.getElementById(id);
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
let sb,uid,code,room={},toks=[],msgs=[],members=[],ini=[],online=[],ruling=false,rp=null,isGM=false,myName='',drag=null,ed=null,asked=false,imgRatio=null,lastUrl=null,pend='',timer;
const clamp=v=>Math.max(0,Math.min(100,v));
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
async function safe(fn){try{const r=await fn();if(r&&r.error)throw r.error}catch(e){toast('Não foi possível: '+((e&&e.message)||'erro'))}}
const T=()=>sb.from('tokens');
const setRoom=p=>{Object.assign(room,p);render();safe(()=>sb.from('rooms').update(p).eq('id',code))};
function paint(el,t){el.style.backgroundColor=t.img?'transparent':(t.color||'#888');el.style.backgroundImage=t.img?'url("'+t.img+'")':'none';el.textContent=t.img?'':(t.emoji||(t.name||'?').slice(0,1).toUpperCase())}
function shrink(f,n){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,n/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('imagem inválida')),'image/webp',.9)};im.onerror=()=>no(new Error('imagem inválida'));im.src=u})}
async function upload(blob,ext,type){
  const path=code+'/'+uid.slice(0,8)+'-'+Date.now()+'.'+ext;
  const r=await sb.storage.from('mesa').upload(path,blob,{contentType:type});
  if(r.error)throw r.error;
  return sb.storage.from('mesa').getPublicUrl(path).data.publicUrl;
}

function render(){
  if(drag||!code)return;
  renderCombat();
  const b=$('board'),u=room.map_url||'';
  b.className=room.grid?'grid':'';
  b.style.width=((room.scale||100)*($('zoom').value/100))+'%';b.style.setProperty('--gs',(100/(room.cols||20))+'cqw');
  b.style.backgroundImage=u?'url("'+u+'")':'none';
  if(u!==lastUrl){lastUrl=u;imgRatio=null;if(u){const im=new Image();im.onload=()=>{if(lastUrl===u){imgRatio=im.naturalWidth+'/'+im.naturalHeight;render()}};im.src=u}}
  b.style.aspectRatio=(room.ratio&&room.ratio!=='auto')?room.ratio:(imgRatio||'16/10');
  b.querySelectorAll('.tok').forEach(e=>e.remove());
  const cur=curTurn();
  toks.filter(t=>t.kind!=='lib').forEach(t=>{
    const can=isGM||(t.kind==='pl'&&t.owner===uid);
    const el=document.createElement('div');
    el.className='tok'+(can?' can':'')+(cur&&cur.token===t.id?' turn':'')+(t.hidden?' ghost':'');
    el.style.cssText='--s:'+(t.size||8)+';left:'+t.x+'%;top:'+t.y+'%';
    paint(el,t);
    if(t.img){el.className+=' img';const im=new Image();im.src=t.img;im.draggable=false;el.appendChild(im)}
    const n=document.createElement('span');n.className='n';n.textContent=t.name||'';el.appendChild(n);
    if(can){
      el.onpointerdown=e=>{if(ruling)return;if(!isGM&&myPerm()&&!myPerm().can_move){toast('O mestre bloqueou seu movimento');return}e.preventDefault();el.setPointerCapture(e.pointerId);drag={el,t,sx:e.clientX,sy:e.clientY,moved:false}};
      el.onpointermove=e=>{
        if(!drag||drag.el!==el)return;
        if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4)drag.moved=true;
        if(!drag.moved)return;
        const r=b.getBoundingClientRect();
        drag.x=clamp((e.clientX-r.left)/r.width*100);drag.y=clamp((e.clientY-r.top)/r.height*100);
        el.style.left=drag.x+'%';el.style.top=drag.y+'%';
      };
      el.onpointerup=async()=>{
        const d=drag;drag=null;if(!d)return;
        if(!d.moved){openEd(t.kind,t.id);return}
        t.x=d.x;t.y=d.y;
        await safe(()=>T().update({x:d.x,y:d.y}).eq('id',t.id));
        render();
      };
    }
    b.appendChild(el);
  });
  const mine=toks.find(t=>t.kind==='pl'&&t.owner===uid);
  $('mine').textContent=mine?'Editar meu token':'Criar meu token';
  if(!isGM&&!asked&&!mine){asked=true;openEd('pl',null)}
}
function renderLib(){
  const l=$('libl');l.textContent='';
  const items=toks.filter(t=>t.kind==='lib');
  if(!items.length){l.textContent='Biblioteca vazia. Crie tokens aqui ou salve NPCs do mapa para reutilizar.';return}
  items.forEach(t=>{
    const c=document.createElement('div');c.className='chip';
    const i=document.createElement('span');i.className='mini';paint(i,t);
    const nm=document.createElement('button');nm.textContent=t.name;nm.title='Colocar no mapa';
    nm.onclick=()=>safe(()=>T().insert({room:code,kind:'npc',x:50,y:50,name:t.name,emoji:t.emoji,color:t.color,size:t.size,img:t.img}));
    const ee=document.createElement('button');ee.textContent='✎';ee.onclick=()=>openEd('lib',t.id);
    const dd=document.createElement('button');dd.textContent='✕';dd.onclick=()=>safe(()=>T().delete().eq('id',t.id));
    c.append(i,nm,ee,dd);l.appendChild(c);
  });
}
function renderChat(){
  const l=$('log'),bot=l.scrollTop+l.clientHeight>=l.scrollHeight-30;l.textContent='';
  msgs.forEach(m=>{const d=document.createElement('div');d.className=m.roll?'roll':'';const n=document.createElement('b');n.textContent=m.name+': ';d.append(n,document.createTextNode(m.text));l.appendChild(d)});
  if(bot)l.scrollTop=l.scrollHeight;
}

const myPerm=()=>members.find(x=>x.uid===uid);
function tab(){}
const tg=i=>{$(i).style.display=$(i).style.display==='none'?'':'none'};
$('bcb').onclick=()=>tg('cb');$('bpj').onclick=()=>tg('pj');
function renderRoster(){
  const l=$('pjl');l.textContent='';
  if(!members.length){l.textContent='Nenhum jogador entrou ainda.';return}
  members.forEach(m=>{
    const d=document.createElement('div');d.className='chip';d.style.cssText='width:100%;margin-bottom:6px;flex-wrap:wrap';
    const nm=document.createElement('b');nm.textContent=(online.includes(m.uid)?'🟢 ':'⚪ ')+(m.name||'Jogador');
    d.appendChild(nm);
    [['Mover','can_move'],['Chat','can_chat'],['Editar token','can_edit'],['Rolar dados','can_roll'],['Aprovado','approved']].forEach(([lab,key])=>{
      const w=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=m[key];
      c.onchange=()=>safe(()=>sb.from('members').update({[key]:c.checked}).eq('room',code).eq('uid',m.uid));
      w.style.marginLeft='10px';w.append(c,' '+lab);d.appendChild(w);
    });
    l.appendChild(d);
  });
}
const order=()=>ini.slice().sort((a,b)=>b.total-a.total||b.mod-a.mod||String(a.token).localeCompare(b.token));
function curTurn(){if(room.combat!=='active')return null;const o=order();return o.length?o[Math.min(room.turn||0,o.length-1)]:null}
function renderCombat(){
  const o=order(),cur=curTurn(),st=room.combat,l=$('cbl');l.textContent='';
  if(st!==window._ls){window._ls=st;if(st)$('cb').style.display=''}
  $('cbs').textContent=st==='active'?'Rodada '+(room.round||1)+(cur?' — vez de '+cur.name:''):st==='rolling'?'Rolando iniciativa… jogadores, rolem seus dados!':'Sem combate no momento.';
  o.forEach(e=>{
    const d=document.createElement('div');d.className='chip';d.style.cssText='width:100%;margin-bottom:4px';
    d.textContent=(cur&&cur.token===e.token?'▶ ':'')+e.name+' — '+e.roll+(e.mod?(e.mod>0?'+':'')+e.mod:'')+' = '+e.total;
    if(isGM){const x=document.createElement('button');x.textContent='✕';x.onclick=()=>safe(()=>sb.from('initiative').delete().eq('room',code).eq('token',e.token));d.appendChild(x)}
    l.appendChild(d);
  });
  const mine=toks.find(t=>t.kind==='pl'&&t.owner===uid);
  $('cbp').style.display=(!isGM&&st==='rolling'&&mine&&!ini.some(e=>e.token===mine.id))?'flex':'none';
  $('cbg').style.display=isGM?'flex':'none';
  $('c-start').style.display=st?'none':'';
  $('c-npc').style.display=$('c-go').style.display=st==='rolling'?'':'none';
  $('c-next').style.display=st==='active'?'':'none';
  $('c-end').style.display=st?'':'none';
}
$('c-start').onclick=()=>safe(async()=>{await sb.from('initiative').delete().eq('room',code);ini=[];setRoom({combat:'rolling',turn:0,round:1})});
$('c-npc').onclick=()=>safe(()=>Promise.all(toks.filter(t=>t.kind==='npc'&&!t.hidden&&!ini.some(e=>e.token===t.id)).map(t=>sb.rpc('roll_initiative',{r:code,t:t.id,m:0}))));
$('c-go').onclick=()=>ini.length?setRoom({combat:'active',turn:0,round:1}):toast('Ninguém rolou iniciativa ainda');
$('c-next').onclick=()=>{const n=order().length||1,t=((room.turn||0)+1)%n;setRoom({turn:t,round:(room.round||1)+(t===0?1:0)})};
$('c-end').onclick=()=>safe(async()=>{await sb.from('initiative').delete().eq('room',code);ini=[];setRoom({combat:null,turn:0,round:1})});
$('iroll').onclick=()=>{const m=toks.find(t=>t.kind==='pl'&&t.owner===uid);if(!m){toast('Crie seu token primeiro');return}safe(()=>sb.rpc('roll_initiative',{r:code,t:m.id,m:+$('imod').value||0}))};
$('closed').onchange=e=>setRoom({closed:e.target.checked});
$('cell').onchange=e=>setRoom({cell_m:+e.target.value||1.5});
$('cols').onchange=e=>setRoom({cols:Math.max(5,Math.min(100,+e.target.value||20))});
$('zoom').oninput=render;
$('ruler').onclick=()=>{ruling=!ruling;$('ruler').className=ruling?'p':'';$('board').style.touchAction=ruling?'none':'';if(!ruling){$('rsv').style.display='none';$('rd').textContent=''}};
const bp=e=>{const r=$('board').getBoundingClientRect();return[clamp((e.clientX-r.left)/r.width*100),clamp((e.clientY-r.top)/r.height*100)]};
function meas(q){
  const b=$('board'),W=b.clientWidth,H=b.clientHeight,l=$('rl');
  $('rsv').style.display='block';
  l.setAttribute('x1',rp[0]+'%');l.setAttribute('y1',rp[1]+'%');l.setAttribute('x2',q[0]+'%');l.setAttribute('y2',q[1]+'%');
  const sq=Math.hypot((q[0]-rp[0])/100*W,(q[1]-rp[1])/100*H)/(W/(room.cols||20));
  $('rd').textContent='📏 '+sq.toFixed(1)+' quadrados · '+(sq*(room.cell_m||1.5)).toFixed(1)+' m';
}
$('board').onpointerdown=e=>{if(!ruling)return;rp=bp(e);$('board').setPointerCapture(e.pointerId);meas(rp)};
$('board').onpointermove=e=>{if(ruling&&rp)meas(bp(e))};
$('board').onpointerup=()=>{rp=null};

function prev(){paint($('f-prev'),{color:$('f-color').value,img:pend,emoji:$('f-emoji').value,name:$('f-name').value})}
function openEd(kind,id){
  const t=toks.find(x=>x.id===id)||{};
  ed={kind,id};pend=t.img||'';
  $('f-name').value=t.name||'';$('f-emoji').value=t.emoji||'';
  $('f-color').value=t.color||(kind==='pl'?'#2e86de':'#c0392b');
  $('f-size').value=t.size||8;
  $('e-del').style.display=id?'':'none';
  $('e-lib').style.display=(isGM&&kind==='npc')?'':'none';
  $('f-hid').checked=!!t.hidden;$('f-hl').style.display=(isGM&&kind==='npc')?'':'none';
  prev();$('ed').classList.add('on');
}
function closeEd(){$('ed').classList.remove('on');ed=null}
function fields(){return{name:$('f-name').value.trim()||'Sem nome',emoji:$('f-emoji').value.trim(),color:$('f-color').value,size:isGM?+$('f-size').value:Math.min(+$('f-size').value,12),img:pend,hidden:!!(isGM&&ed&&ed.kind==='npc'&&$('f-hid').checked)}}
['f-name','f-emoji','f-color'].forEach(i=>$(i).oninput=prev);
$('f-noimg').onclick=()=>{pend='';prev()};
$('f-file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  toast('Enviando foto…');
  await safe(async()=>{pend=await upload(await shrink(f,512),'webp','image/webp');prev()});
  e.target.value='';
};
$('e-x').onclick=closeEd;
$('e-save').onclick=()=>{
  if(!ed)return;const {kind,id}=ed,f=fields();closeEd();
  safe(()=>id?T().update(f).eq('id',id):T().insert(Object.assign({room:code,kind,x:50,y:50,owner:kind==='pl'?uid:null},f)));
};
$('e-lib').onclick=()=>{const f=fields();closeEd();safe(()=>T().insert(Object.assign({room:code,kind:'lib'},f)));toast('Salvo na biblioteca')};
$('e-del').onclick=()=>{if(!ed||!ed.id)return;const id=ed.id;closeEd();safe(()=>T().delete().eq('id',id))};
$('mine').onclick=()=>{const m=toks.find(t=>t.kind==='pl'&&t.owner===uid);openEd('pl',m?m.id:null)};
$('addnpc').onclick=()=>openEd('npc',null);
$('newlib').onclick=()=>openEd('lib',null);
$('liblb').onclick=()=>{const p=$('libp');p.style.display=p.style.display==='none'?'flex':'none'};
$('nomap').onclick=()=>setRoom({map_url:null});
$('grid').onchange=e=>setRoom({grid:e.target.checked});
$('scale').onchange=e=>setRoom({scale:+e.target.value});
$('ratio').onchange=e=>setRoom({ratio:e.target.value});
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  toast('Enviando mapa…');
  await safe(async()=>{const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');setRoom({map_url:await upload(f,ext,f.type)})});
  e.target.value='';
};

function roll(s){
  const m=s.match(/^(\d*)d(\d+)\s*([+-]\s*\d+)?$/i);if(!m)return null;
  const n=Math.min(+m[1]||1,20),f=Math.min(+m[2],1000);if(f<2)return null;
  const r=[];for(let i=0;i<n;i++)r.push(1+Math.floor(Math.random()*f));
  const k=m[3]?+m[3].replace(/\s/g,''):0,ks=k?(k>0?'+':'')+k:'';
  return '🎲 '+n+'d'+f+ks+' → ['+r.join(', ')+']'+ks+' = '+(r.reduce((a,b)=>a+b,0)+k);
}
function send(){
  const inp=$('cin'),s=inp.value.trim();if(!s)return;
  if(!isGM&&myPerm()&&!myPerm().can_chat){toast('O mestre silenciou você no chat');return}
  let text=s,isRoll=false;const rm=s.match(/^\/r(?:oll)?\s+(.+)$/i);
  if(rm){if(!isGM&&myPerm()&&!myPerm().can_roll){toast('O mestre bloqueou suas rolagens');return}const r=roll(rm[1].trim());if(!r){toast('Exemplo: /r 1d20+3');return}text=r;isRoll=true}
  inp.value='';
  const mine=toks.find(t=>t.kind==='pl'&&t.owner===uid);
  const name=isGM?'Mestre':(mine&&mine.name)||myName||'Jogador';
  safe(()=>sb.from('messages').insert({room:code,name,text,roll:isRoll}));
}
$('csend').onclick=send;
$('cin').onkeydown=e=>{if(e.key==='Enter')send()};
$('cclr').onclick=()=>safe(()=>sb.from('messages').delete().eq('room',code));

async function load(){
  const [r,t,m,mb,ii]=await Promise.all([
    sb.from('rooms').select().eq('id',code).maybeSingle(),
    sb.from('tokens').select().eq('room',code),
    sb.from('messages').select().eq('room',code).order('created_at',{ascending:false}).limit(60),
    sb.from('members').select().eq('room',code),
    sb.from('initiative').select().eq('room',code)]);
  if(r.data)room=r.data;if(t.data)toks=t.data;if(m.data)msgs=m.data.reverse();members=mb.data||[];ini=ii.data||[];
  isGM=room.gm===uid;
  $('role').textContent=isGM?'Mestre':'Jogador';
  $('mine').style.display=isGM?'none':'';$('bpj').style.display=isGM?'':'none';$('gmw').style.display=isGM?'':'none';
  $('grid').checked=!!room.grid;$('scale').value=room.scale||100;$('ratio').value=room.ratio||'auto';$('cell').value=room.cell_m||1.5;$('cols').value=room.cols||20;$('closed').checked=!!room.closed;
  {const pm=myPerm();$('wait').style.display=(!isGM&&pm&&!pm.approved)?'block':'none'}
  render();renderLib();renderChat();renderRoster();
}
const sched=()=>{clearTimeout(timer);timer=setTimeout(load,120)};
async function start(c){
  code=c;myName=$('name').value.trim()||'Jogador';LS('rpg_name',myName);LS('rpg_code',c);
  await load();
  if(!isGM){await sb.from('members').upsert({room:c,uid,name:myName},{onConflict:'room,uid',ignoreDuplicates:true});await load()}
  $('lobby').style.display='none';$('app').style.display='block';tab('chat');$('inv').style.display='';
  document.title='Mesa '+c;
  const ch=sb.channel('mesa-'+c,{config:{presence:{key:uid}}})
    .on('postgres_changes',{event:'*',schema:'public',table:'tokens',filter:'room=eq.'+c},sched)
    .on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:'id=eq.'+c},sched)
    .on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:'room=eq.'+c},sched)
    .on('postgres_changes',{event:'*',schema:'public',table:'members',filter:'room=eq.'+c},sched)
    .on('postgres_changes',{event:'*',schema:'public',table:'initiative',filter:'room=eq.'+c},sched)
    .on('presence',{event:'sync'},()=>{online=Object.keys(ch.presenceState());renderRoster()})
    .subscribe(s=>{if(s==='SUBSCRIBED')ch.track({n:myName})});
}
$('join').onclick=async()=>{
  const c=$('code').value.trim().toUpperCase();if(!c){toast('Digite o código da mesa');return}
  const r=await sb.from('rooms').select('id').eq('id',c).maybeSingle();
  if(r.error){toast(r.error.message);return}
  if(!r.data){toast('Mesa não encontrada');return}
  start(c);
};
$('create').onclick=async()=>{
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];
  const r=await sb.from('rooms').insert({id:c,gm:uid});
  if(r.error){toast(r.error.message);return}
  start(c);
};
$('inv').onclick=()=>{
  const u=location.origin+location.pathname+'?sala='+code;
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copiado! Mande para os amigos.'),()=>prompt('Copie o link:',u));
};
(async()=>{
  $('name').value=LS('rpg_name')||'';
  $('code').value=(new URLSearchParams(location.search).get('sala')||LS('rpg_code')||'').toUpperCase();
  if(SB_URL.startsWith('COLE')){$('msg').textContent='Falta colar a URL e a chave do Supabase no começo do script (veja as instruções).';return}
  try{
    sb=supabase.createClient(SB_URL,SB_KEY);
    let s=(await sb.auth.getSession()).data.session;
    if(!s){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;s=r.data.session}
    uid=s.user.id;
  }catch(e){$('msg').textContent='Erro ao conectar: '+((e&&e.message)||e)+' (confira se o login anônimo está ativado no Supabase).'}
})();
</script></body></html>
